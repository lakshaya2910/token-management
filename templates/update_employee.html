<!DOCTYPE html>
<html>

<head>

    <title>Update Employee</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="navbar">

    <h2>Update Employee</h2>

    <a href="{{ url_for('search_employee') }}">
        Back
    </a>

</div>


<div class="form-container">

    <h1>
        ✏️ Update Employee
    </h1>


    <form method="POST">

        <label>
            Employee ID
        </label>

        <input type="text"
               name="employee_id"
               value="{{ employee['employee_id'] }}"
               required>


        <label>
            Employee Name
        </label>

        <input type="text"
               name="employee_name"
               value="{{ employee['employee_name'] }}"
               required>


        <label>
            Department
        </label>

        <input type="text"
               name="department"
               value="{{ employee['department'] or '' }}">


        <button class="btn save-btn">

            Update Employee

        </button>

    </form>

</div>

</body>
</html>
